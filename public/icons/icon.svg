<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle spiritual halo circle -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.35" stroke-dasharray="12 12"/>
  <circle cx="256" cy="220" r="120" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2"/>

  <!-- Coptic / Christian Cross Icon -->
  <g filter="url(#shadow)" fill="url(#gold)">
    <!-- Vertical beam -->
    <rect x="236" y="90" width="40" height="260" rx="12"/>
    <!-- Horizontal beam -->
    <rect x="156" y="170" width="200" height="40" rx="12"/>
    <!-- Cross decorative ends -->
    <circle cx="256" cy="90" r="14"/>
    <circle cx="256" cy="350" r="14"/>
    <circle cx="156" cy="190" r="14"/>
    <circle cx="356" cy="190" r="14"/>
  </g>

  <!-- Arabic Typography "إعدادي" -->
  <text x="256" y="425" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="52" font-weight="bold" fill="#ffffff" letter-spacing="2">خدمة إعدادي</text>
  <text x="256" y="465" text-anchor="middle" font-family="'Tajawal', sans-serif" font-size="22" font-weight="500" fill="#93c5fd" opacity="0.9">افتـقاد • حـضور • رعاية</text>
</svg>
